<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- SEO Meta Tags — helps clients find you on Google -->
    <meta
      name="description"
      content="Bashir Sani Ibrahim — Full-Stack Developer & AI Engineer. Django, Python, Machine Learning, IoT, React. Available for freelance projects."
    />
    <meta
      name="keywords"
      content="Django developer, Python, Machine Learning, IoT, React, AI, freelance, Nigeria"
    />
    <meta name="author" content="Bashir Sani Ibrahim" />

    <!-- Open Graph — controls how your link looks when shared on WhatsApp, LinkedIn etc -->
    <meta
      property="og:title"
      content="Bashir Sani Ibrahim | Full-Stack Developer & AI Engineer"
    />
    <meta
      property="og:description"
      content="Django, Python, Machine Learning, IoT & React specialist. Available for freelance."
    />
    <meta property="og:type" content="website" />

    <!-- Google Fonts — loads Syne (headings) and DM Sans (body text) -->
    <!-- This MUST be in index.html so fonts load before React renders -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
      rel="stylesheet"
    />

    <title>Bashir Sani Ibrahim | Full-Stack Developer & AI Engineer</title>
  </head>
  <body>
    <!-- React injects your entire app inside this div -->
    <!-- Do NOT add anything else inside this div -->
    <div id="root"></div>
  </body>
</html>
